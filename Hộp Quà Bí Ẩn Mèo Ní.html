<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
  /* Layout: one centred column. Gift box on a blush stage with the password field under it.
     When the box opens, the greeting card takes the place of the field. */
  :root{
    --bg:#FFF0F4;
    --halo:#FFD6E3;
    --surface:#FFFFFF;
    --ink:#3B1228;
    --muted:#85586D;
    --line:#F0CBD8;
    --ring:rgba(219,42,102,.18);
    --shadow:rgba(120,20,60,.28);
    --err:#B3123F;

    --rose:#DB2A66;
    --rose-deep:#A8174A;
    --rose-lit:#F0507F;
    --on-rose:#FFFFFF;
    --gold:#F0B03C;
    --gold-deep:#C98616;
    --gold-lit:#FFD983;

    --p1:#E5336D;
    --p2:#FF8FB1;
    --p3:#F2B544;
    --p4:#FFC4D6;

    --font-display:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1C0A15;
      --halo:#4B1A39;
      --surface:#2A1121;
      --ink:#FFE8F0;
      --muted:#D0A3B7;
      --line:#4A2339;
      --ring:rgba(255,107,154,.28);
      --shadow:rgba(0,0,0,.55);
      --err:#FF8FB0;
      --rose:#FF6B9A;
      --rose-deep:#D6336F;
      --rose-lit:#FF93B6;
      --on-rose:#2B0A1A;
      --gold:#F6C45E;
      --gold-deep:#D99A22;
      --gold-lit:#FFE3A1;
      --p1:#FF6B9A;
      --p2:#FF9DBB;
      --p3:#F6C45E;
      --p4:#FFD3E0;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1C0A15;
    --halo:#4B1A39;
    --surface:#2A1121;
    --ink:#FFE8F0;
    --muted:#D0A3B7;
    --line:#4A2339;
    --ring:rgba(255,107,154,.28);
    --shadow:rgba(0,0,0,.55);
    --err:#FF8FB0;
    --rose:#FF6B9A;
    --rose-deep:#D6336F;
    --rose-lit:#FF93B6;
    --on-rose:#2B0A1A;
    --gold:#F6C45E;
    --gold-deep:#D99A22;
    --gold-lit:#FFE3A1;
    --p1:#FF6B9A;
    --p2:#FF9DBB;
    --p3:#F6C45E;
    --p4:#FFD3E0;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{height:100%}
  body{
    min-height:100%;
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding-block:28px;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    background:radial-gradient(80% 55% at 50% 22%,var(--halo),transparent 72%),var(--bg);
    color:var(--ink);
    font:400 16px/1.5 var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  button,input{font:inherit;color:inherit}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

  .wrap{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    overflow-x:clip;
  }

  /* Heading */
  .head{text-align:center}
  .eyebrow{
    margin:0;
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
  }
  h1{
    margin:8px 0 0;
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(2.3rem,9.5vw,3.4rem);
    line-height:1.05;
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  h1 em{font-style:italic;font-weight:500;color:var(--rose)}
  .lead{margin:12px auto 0;max-width:30ch;color:var(--muted);font-size:.95rem;text-wrap:balance}

  /* Gift */
  .stage{
    position:relative;
    width:min(74vw,290px);
    transition:width 1s cubic-bezier(.2,.8,.2,1);
  }
  .stage.open{width:min(54vw,210px)}
  .gift{display:block;width:100%;height:auto;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .st-rose{stop-color:var(--rose)}
  .st-rose-deep{stop-color:var(--rose-deep)}
  .st-rose-lit{stop-color:var(--rose-lit)}
  .st-gold{stop-color:var(--gold)}
  .st-gold-lit{stop-color:var(--gold-lit)}
  .f-gold{fill:var(--gold)}
  .f-gold-lit{fill:var(--gold-lit)}
  .f-ink{fill:var(--ink)}
  .stroke-gold{fill:none;stroke:var(--gold-deep);stroke-width:2;stroke-linecap:round;opacity:.55}

  .bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 4.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-7px)}}
  .shadow{opacity:.18;transform-box:fill-box;transform-origin:50% 50%;animation:sh 4.6s ease-in-out infinite}
  @keyframes sh{50%{opacity:.1;transform:scale(.9)}}
  .stage.wiggle .bob{animation:wig .55s ease-in-out}
  @keyframes wig{
    0%,100%{transform:rotate(0)}
    20%{transform:rotate(-4deg) translateY(-4px)}
    40%{transform:rotate(4deg) translateY(-4px)}
    60%{transform:rotate(-3deg)}
    80%{transform:rotate(2deg)}
  }
  .lid{
    transform-box:fill-box;
    transform-origin:50% 100%;
    transition:transform .9s cubic-bezier(.3,1.5,.5,1);
  }
  .stage.open .lid{transform:translate(44px,-88px) rotate(17deg)}
  .rays{opacity:0;transition:opacity 1s .25s;pointer-events:none}
  .stage.open .rays{opacity:1}
  .rim{opacity:0;transition:opacity .6s .3s}
  .stage.open .rim{opacity:.9}
  .tw{
    opacity:.8;
    transform-box:fill-box;
    transform-origin:center;
    animation:tw 2.8s var(--d,0s) ease-in-out infinite;
  }
  @keyframes tw{
    0%,100%{opacity:.15;transform:scale(.4) rotate(0)}
    50%{opacity:1;transform:scale(1) rotate(45deg)}
  }

  /* Password form */
  .lock{width:100%;display:flex;flex-direction:column;gap:8px}
  .field{display:flex;gap:10px;width:100%}
  .field.shake{animation:shake .4s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    55%{transform:translateX(7px)}
    80%{transform:translateX(-3px)}
  }
  input[type="password"]{
    flex:1;
    min-width:0;
    height:52px;
    padding:0 16px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:var(--surface);
    font-size:1rem;
    transition:border-color .2s,box-shadow .2s;
  }
  input[type="password"]::placeholder{color:var(--muted);opacity:.75}
  input[type="password"]:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px var(--ring)}
  .btn{
    height:52px;
    padding:0 22px;
    border:0;
    border-radius:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s,filter .2s,background-color .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn:focus-visible,.link:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
  .btn-main{background:var(--rose);color:var(--on-rose)}
  .btn-main:hover{filter:brightness(1.06)}
  .btn-soft{height:44px;padding:0 18px;background:transparent;border:1.5px solid var(--line);color:var(--ink)}
  .btn-soft:hover{border-color:var(--rose)}
  .err{margin:0;min-height:1.4em;text-align:center;font-size:.875rem;color:var(--err)}

  /* Greeting card */
  .card{
    width:100%;
    padding:26px 24px 20px;
    text-align:center;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 22px 44px -26px var(--shadow);
  }
  .card:focus{outline:none}
  .card.show{animation:cardIn .9s .6s cubic-bezier(.2,.9,.25,1) backwards}
  @keyframes cardIn{from{opacity:0;transform:translateY(26px) scale(.97)}}
  .spark-mark{display:block;margin:0 auto 10px}
  .card h2{
    margin:0;
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.55rem;
    line-height:1.2;
    text-wrap:balance;
  }
  .msg{margin:14px auto 0;max-width:36ch;font-size:1.02rem;line-height:1.75;text-wrap:pretty}
  .w{display:inline-block}
  .card.show .w{animation:word .55s calc(var(--i) * 34ms + 1s) cubic-bezier(.2,.9,.25,1) backwards}
  @keyframes word{from{opacity:0;transform:translateY(8px)}}
  .actions{margin-top:20px;display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;align-items:center}
  .link{
    height:44px;
    padding:0 10px;
    border:0;
    background:none;
    color:var(--muted);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .link:hover{color:var(--ink)}

  /* Switching state without animation (restoring an opened box) */
  .instant *,.instant *::before,.instant *::after{transition-duration:0s!important;animation-duration:0s!important;animation-delay:0s!important}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
  }
</style>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="head">
    <p class="eyebrow">Ngày Phụ nữ Việt Nam · 20/10</p>
    <h1>Hộp quà <em>bí ẩn</em></h1>

  <div class="stage" id="stage">
    <svg class="gift" id="gift" viewBox="0 24 260 256" role="img" aria-label="Hộp quà màu hồng thắt nơ vàng" focusable="false">
      <defs>
        <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" class="st-rose"/><stop offset="1" class="st-rose-deep"/>

      </g>

      <g transform="translate(26 112)"><path class="tw f-gold" style="--d:.2s" d="M0 -9C1.2 -2.5 2.5 -1.2 9 0C2.5 1.2 1.2 2.5 0 9C-1.2 2.5 -2.5 1.2 -9 0C-2.5 -1.2 -1.2 -2.5 0 -9Z"/></g>
      <g transform="translate(238 92) scale(.8)"><path class="tw f-gold" style="--d:1.1s" d="M0 -9C1.2 -2.5 2.5 -1.2 9 0C2.5 1.2 1.2 2.5 0 9C-1.2 2.5 -2.5 1.2 -9 0C-2.5 -1.2 -1.2 -2.5 0 -9Z"/></g>
      <g transform="translate(228 204) scale(1.1)"><path class="tw f-gold" style="--d:1.7s" d="M0 -9C1.2 -2.5 2.5 -1.2 9 0C2.5 1.2 1.2 2.5 0 9C-1.2 2.5 -2.5 1.2 -9 0C-2.5 -1.2 -1.2 -2.5 0 -9Z"/></g>
      <g transform="translate(34 214) scale(.7)"><path class="tw f-gold" style="--d:.7s" d="M0 -9C1.2 -2.5 2.5 -1.2 9 0C2.5 1.2 1.2 2.5 0 9C-1.2 2.5 -2.5 1.2 -9 0C-2.5 -1.2 -1.2 -2.5 0 -9Z"/></g>

  <form class="lock" id="lock" novalidate autocomplete="off">

<script>
(function(){
  var SECRET = "20_10vuive";
  var KEY = "hop-qua-20-10";
  var $ = function(id){ return document.getElementById(id); };
  var stage=$('stage'), form=$('lock'), field=$('field'), pwd=$('pwd'), err=$('err'),
      card=$('card'), msg=$('msg'), title=$('title'), copyBtn=$('copy'), closeBtn=$('close'), lead=$('lead');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var isOpen=false, busy=false;

  /* Split the message into words so they can fade in one by one */
  var original = msg.textContent.trim().replace(/\s+/g,' ');
  msg.innerHTML = original.split(' ').map(function(w,i){
    return '<span class="w" style="--i:'+i+'">'+w+'</span>';
  }).join(' ');

  function kick(el, cls){
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    el.addEventListener('animationend', function(){ el.classList.remove(cls); }, {once:true});
  }
  function store(v){
    try{ if(v) localStorage.setItem(KEY,'1'); else localStorage.removeItem(KEY); }catch(e){}
  }

  /* ---------- Falling petals and confetti ---------- */
  var cvs=$('fx'), ctx=cvs.getContext('2d');
  var W=0,H=0,pal=[],parts=[],raf=0,last=0;
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function readPal(){
    var s=getComputedStyle(document.documentElement);
    pal=['--p1','--p2','--p3','--p4'].map(function(k){ return s.getPropertyValue(k).trim()||'#ff6b9a'; });
  }
  function size(){
    var d=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    cvs.width=Math.round(W*d); cvs.height=Math.round(H*d);
    ctx.setTransform(d,0,0,d,0,0);
  }
  function ambient(){
    var n=W<600?9:14;
    for(var i=0;i<n;i++){
      parts.push({amb:true,k:0,c:i%4,x:rnd(0,W),y:rnd(-H,H),s:rnd(7,12),vx:rnd(-6,6),vy:rnd(18,34),
        sw:rnd(14,30),f:rnd(.4,.9),ph:rnd(0,6.28),r:rnd(0,6.28),vr:rnd(-.5,.5),fl:rnd(0,6.28),fs:rnd(1,2.2),a:rnd(.35,.6)});
    }
  }
  function burst(){
    if(reduce.matches) return;
    var r=stage.getBoundingClientRect();
    var ox=r.left+r.width/2, oy=r.top+r.height*.36;
    var n=W<600?70:110;
    for(var i=0;i<n;i++){
      var ang=-Math.PI/2+rnd(-.9,.9), sp=rnd(260,640);
      var q=Math.random(), k=q<.6?0:(q<.82?1:2);
      parts.push({k:k,c:(Math.random()*4)|0,x:ox+rnd(-40,40),y:oy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
        s:k===0?rnd(8,15):rnd(4,8),sw:rnd(20,50),f:rnd(.8,1.6),ph:rnd(0,6.28),r:rnd(0,6.28),vr:rnd(-4,4),
        fl:rnd(0,6.28),fs:rnd(3,7),life:rnd(3.2,5.2),a:1});
    }
    start();
  }
  function draw(p,a){
    ctx.globalAlpha=a; ctx.fillStyle=pal[p.c];
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.r);
    ctx.scale(1,Math.max(.15,Math.abs(Math.cos(p.fl))));
    if(p.k===0){
      var s=p.s;
      ctx.beginPath(); ctx.moveTo(0,-s);
      ctx.bezierCurveTo(s*.9,-s*.5,s*.9,s*.5,0,s);
      ctx.bezierCurveTo(-s*.9,s*.5,-s*.9,-s*.5,0,-s);
      ctx.fill();
    }else if(p.k===1){
      ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);
    }else{
      ctx.beginPath(); ctx.arc(0,0,p.s/2,0,6.283); ctx.fill();
    }
    ctx.restore();
  }
  function frame(t){
    raf=requestAnimationFrame(frame);
    var dt=Math.min(.05,(t-last)/1000||.016); last=t;
    ctx.clearRect(0,0,W,H);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.fl+=p.fs*dt; p.r+=p.vr*dt;
      if(p.amb){
        p.y+=p.vy*dt;
        p.x+=(p.vx+Math.sin(t/1000*p.f+p.ph)*p.sw)*dt;
        if(p.y>H+20){ p.y=-20; p.x=rnd(0,W); }
        if(p.x<-30) p.x=W+20;
        if(p.x>W+30) p.x=-20;
        draw(p,p.a);
      }else{
        p.life-=dt;
        p.vx-=p.vx*1.4*dt;
        p.vy+=(190-1.2*p.vy)*dt;
        p.x+=(p.vx+Math.sin(t/1000*p.f+p.ph)*p.sw)*dt;
        p.y+=p.vy*dt;
        if(p.life<=0||p.y>H+30){ parts.splice(i,1); continue; }
        draw(p,Math.min(1,p.life/.9));
      }
    }
    if(!parts.length){ cancelAnimationFrame(raf); raf=0; }
  }
  function start(){
    if(!raf && !document.hidden){ last=performance.now(); raf=requestAnimationFrame(frame); }
  }
  size(); readPal();
  if(!reduce.matches) ambient();
  start();
  window.addEventListener('resize', size);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ cancelAnimationFrame(raf); raf=0; } else start();
  });
  try{
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readPal);
    new MutationObserver(readPal).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  }catch(e){}

  /* ---------- Open and close ---------- */
  function openBox(silent){
    isOpen=true; busy=false;
    if(silent) document.body.classList.add('instant');
    stage.classList.add('open');
    lead.hidden=true; form.hidden=true; err.textContent='';
    card.hidden=false;
    if(!silent){
      card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
      setTimeout(burst,280);
      setTimeout(function(){
        try{ card.focus({preventScroll:true}); }catch(e){}
        card.scrollIntoView({behavior:reduce.matches?'auto':'smooth',block:'nearest'});
      },700);
    }else{
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.remove('instant'); }); });
    }
    store(true);
  }
  function closeBox(){
    isOpen=false;
    stage.classList.remove('open');
    card.classList.remove('show');
    card.hidden=true; form.hidden=false; lead.hidden=false;
    pwd.value=''; err.textContent='';
    store(false);
    try{ pwd.focus({preventScroll:true}); }catch(e){}
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(busy||isOpen) return;
    var v=(pwd.value||'').trim().toLowerCase();
    if(v===SECRET){
      busy=true; err.textContent='';
      if(reduce.matches){ openBox(false); return; }
      stage.classList.add('wiggle');
      setTimeout(function(){ stage.classList.remove('wiggle'); openBox(false); },520);
    }else{
      err.textContent='Mật khẩu chưa đúng, bạn thử lại nhé.';
      kick(field,'shake');
      if(navigator.vibrate){ try{ navigator.vibrate(80); }catch(x){} }
      pwd.select();
    }
  });

  $('gift').addEventListener('click', function(){
    if(isOpen||busy) return;
    kick(stage,'wiggle');
    pwd.focus({preventScroll:true});
  });

  closeBtn.addEventListener('click', closeBox);

  copyBtn.addEventListener('click', function(){
    var label=copyBtn.querySelector('span');
    var text=title.textContent.trim()+'\n\n'+original;
    function flash(t){
      label.textContent=t;
      setTimeout(function(){ label.textContent='Sao chép lời chúc'; },2000);
    }
    function selectText(){
      var r=document.createRange(); r.selectNodeContents(msg);
      var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      flash('Đã chọn, hãy sao chép');
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ flash('Đã sao chép'); }, selectText);
    }else{
      selectText();
    }
  });

  /* Restore an opened box after a reload, without replaying the show */
  try{ if(localStorage.getItem(KEY)==='1') openBox(true); }catch(e){}
  if(!isOpen && window.matchMedia('(hover:hover) and (pointer:fine)').matches){
    try{ pwd.focus({preventScroll:true}); }catch(e){}
  }
})();
</script>
